    <circle cx="30" cy="32" r="5" fill="#005A36" />
  </g>
  <!-- Typography -->
  <text x="115" y="38" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="22" fill="#005A36" letter-spacing="3">FANR</text>
  <text x="115" y="54" font-family="'Inter', 'Montserrat', sans-serif" font-weight="700" font-size="8" fill="#78BE20" letter-spacing="1">FEDERAL AUTHORITY FOR NUCLEAR REGULATION</text>
  <text x="115" y="66" font-family="'Inter', 'Montserrat', sans-serif" font-weight="800" font-size="10" fill="#005A36" letter-spacing="2.5">الهيئة الاتحادية للرقابة النووية</text>
</svg>
